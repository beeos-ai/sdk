name: Publish npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@^11.15.0

      - name: Verify release version
        if: github.event_name == 'push'
        run: |
          package_version=$(node -p "require('./package.json').version")
          if [[ "v${package_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version v${package_version}"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test --if-present

      - name: Check whether this version exists
        id: registry
        run: |
          package_version=$(node -p "require('./package.json').version")
          version_url="https://registry.npmjs.org/%40beeos-ai%2Fsdk/${package_version}"
          if curl --fail --silent --show-error "${version_url}" >/dev/null; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "@beeos-ai/sdk@${package_version} is already published"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Inspect package contents
        if: steps.registry.outputs.exists == 'false'
        run: npm publish --dry-run --access public

      # Token authentication remains supported; GitHub's OIDC identity is still
      # used to attach a verifiable provenance statement to the package.
      - name: Publish with token and provenance
        if: steps.registry.outputs.exists == 'false' && env.NPM_TOKEN != ''
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Publish with npm Trusted Publisher
        if: steps.registry.outputs.exists == 'false' && env.NPM_TOKEN == ''
        run: npm publish --access public --provenance

      - name: Verify public registry access
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error \
              "https://registry.npmjs.org/%40beeos-ai%2Fsdk" >/dev/null; then
              exit 0
            fi
            echo "Waiting for npm registry index (attempt ${attempt}/6)..."
            sleep 10
          done
          echo "::error::Published package is not anonymously readable"
          exit 1
